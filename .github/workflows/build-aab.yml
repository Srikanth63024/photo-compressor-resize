name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper JAR
        run: gradle wrapper --gradle-version 8.10.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Temporary Release Keystore
        run: |
          keytool -genkey -v -keystore release-upload-key.jks \
            -alias compressor-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PhotoCompressor, OU=Mobile, O=Apps, L=City, S=State, C=US"
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Build Release Android App Bundle (.AAB)
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: release-upload-key.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: compressor-key
          KEY_PASSWORD: android

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
          
